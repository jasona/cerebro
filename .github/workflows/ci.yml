name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Vitest on embedded PGlite (the default) and on a PostgreSQL server
  # (TEST_DATABASE_URL: each test database is created from a migrated template).
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [pglite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run

  # The S3 source store, object backups, bucket creation and the off-site copy
  # against SeaweedFS (D25), the object store of the Coolify stack. A service
  # container cannot take arguments, so this uses the image's default
  # `weed mini` (all components in one process); SeaweedFS reads the admin
  # credentials from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY. Keep the tag in
  # step with deploy/coolify/docker-compose.yml.
  s3-store:
    runs-on: ubuntu-latest
    services:
      seaweedfs:
        image: chrislusf/seaweedfs:4.48
        env:
          AWS_ACCESS_KEY_ID: ci-access
          AWS_SECRET_ACCESS_KEY: ci-secret-0123456789
        ports:
          - 8333:8333
        options: >-
          --health-cmd "curl -fsS -o /dev/null http://127.0.0.1:8333/healthz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_S3_ENDPOINT: http://127.0.0.1:8333
      TEST_S3_ACCESS_KEY_ID: ci-access
      TEST_S3_SECRET_ACCESS_KEY: ci-secret-0123456789
      TEST_S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: S3 store and object backups against SeaweedFS (If-None-Match must return 412)
        run: npx vitest run packages/domain/src/sources/s3-store.integration.test.ts packages/domain/src/sources/backup-s3.integration.test.ts

  # The database CLI against PostgreSQL: reset (drop, migrate, seed), then
  # migrate again, which must be a no-op.
  db-cli:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cerebro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cerebro
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:reset
      - name: db:migrate is idempotent
        run: npm run db:migrate | tee migrate.log && grep -q "Database is up to date (postgres)" migrate.log

  # Playwright journeys. pglite: the config starts `next dev` on a fresh PGlite
  # database and jobs run in-process. postgres: the web app and a separate
  # worker process share one PostgreSQL database.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [pglite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cerebro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_PORT: "3400"
      AUTH_MODE: dev
      APP_URL: http://localhost:3400
      CEREBRO_OBJECTS_DIR: ${{ github.workspace }}/.data/objects-e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM_PATH=$(node -e 'import("@playwright/test").then((p) => console.log(p.chromium.executablePath()))')" >> "$GITHUB_ENV"
      - name: Run journeys (PGlite)
        if: matrix.database == 'pglite'
        run: npx playwright test
      - name: Run journeys (PostgreSQL, separate worker)
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/cerebro
          E2E_EXTERNAL_SERVER: "1"
        run: |
          npm run db:reset
          npm exec -w @cerebro/web -- next dev -p "$E2E_PORT" > web.log 2>&1 &
          npm run worker > worker.log 2>&1 &
          curl --fail --silent --output /dev/null --retry 120 --retry-delay 2 --retry-all-errors \
            "http://localhost:$E2E_PORT/dev/sign-in"
          npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.database }}
          path: |
            playwright-report/
            test-results/
            web.log
            worker.log
          if-no-files-found: ignore

  # Production images (deploy/docker) and the Coolify compose stack
  # (deploy/coolify/docker-compose.yml): build both images, start postgres and
  # objects (SeaweedFS) -> migrate (db:provision + db:migrate + objects:init)
  # -> web and worker with production settings (NODE_ENV=production,
  # AUTH_MODE=clerk) and dummy credentials (deploy/coolify/smoke-test.env), then
  # check liveness, readiness, OCR in the standalone web image, the worker,
  # idempotent migrations, org:bootstrap, a source object stored in SeaweedFS,
  # db:backup (pg_dump + the object, sha256-checked), an off-site copy,
  # db:restore into a fresh database and bucket, and a retention sweep.
  images:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: deploy/coolify/docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: cerebro-smoke
      COMPOSE_ENV_FILES: deploy/coolify/smoke-test.env
    steps:
      - uses: actions/checkout@v7
      # `exclude_from_hc` is a Coolify-only key that plain Compose rejects.
      - name: Compose file without Coolify-only keys
        run: sed '/exclude_from_hc/d' deploy/coolify/docker-compose.yml > deploy/coolify/docker-compose.ci.yml
      - name: Build images
        run: docker compose build
      # `up` creates web and worker only after postgres is healthy and migrate
      # has exited 0, and fails if migrate fails.
      - name: Start the stack (migrate must succeed before web and worker start)
        run: |
          docker compose up --detach web worker
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps --quiet objects)")" = healthy
          timeout 300 sh -c 'until [ "$(docker inspect --format "{{.State.Health.Status}}" "$(docker compose ps --quiet web)")" = healthy ]; do sleep 3; done'
      - name: Migration ran once and succeeded
        run: |
          docker compose logs migrate
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet migrate)")" = 0
          docker compose logs migrate | grep -q "Bucket cerebro-sources created"
      - name: The object store is internal and refuses anonymous or unsigned access
        run: |
          test -z "$(docker compose port objects 8333 2>/dev/null)"
          docker compose exec -T objects sh -c 'test "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8333/cerebro-sources)" = 403'
          docker compose exec -T objects sh -c 'test "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8888/buckets/)" = 401'
      - name: Liveness, readiness and no dev sign-in
        run: docker compose exec -T web node --input-type=module - http < deploy/coolify/smoke-check.mjs
      - name: OCR packages in the standalone web image
        run: docker compose exec -T web node --input-type=module - ocr < deploy/coolify/smoke-check.mjs
      - name: OCR in the worker image (extraction jobs run there in production)
        run: docker compose exec -T worker node --input-type=module - ocr package.json < deploy/coolify/smoke-check.mjs
      - name: Worker is running
        run: |
          timeout 60 sh -c 'until docker compose logs worker | grep -q "\"event\":\"worker.started\""; do sleep 2; done'
          docker compose logs worker
      - name: Migrations are idempotent
        run: docker compose run --rm --no-deps -T migrate | tee migrate-again.log && grep -q "Database is up to date (postgres)" migrate-again.log
      - name: org:bootstrap creates the first owner, then changes nothing
        run: |
          docker compose exec -T worker npm run -s org:bootstrap -- --slug smoke --name "Smoke Test" --owner-email owner@smoke.example | tee bootstrap.log
          grep -q "^Created company smoke" bootstrap.log
          docker compose exec -T worker npm run -s org:bootstrap -- --slug smoke --name "Smoke Test" --owner-email owner@smoke.example | grep -q "nothing changed"
          ORG_ID="$(sed -n 's/^Created company smoke (\([0-9a-f-]*\)).*/\1/p' bootstrap.log)"
          test -n "$ORG_ID"
          echo "ORG_ID=$ORG_ID" >> "$GITHUB_ENV"
      - name: A source object is stored in SeaweedFS through the app's S3 store
        run: docker compose exec -T worker node --import tsx --input-type=module - put "$ORG_ID" < deploy/coolify/smoke-objects.mjs
      - name: db:backup includes the object (sha256-checked); retention:sweep
        run: |
          docker compose exec -T worker npm run -s db:backup | tee backup.log
          grep -q "objects from the s3 store" backup.log
          grep -q "No off-site copy made" backup.log
          BACKUP="$(sed -n 's/^Backup written to \(\/backups\/[^ ]*\) .*/\1/p' backup.log)"
          test -n "$BACKUP"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"
          docker compose exec -T worker node --import tsx --input-type=module - backup "$BACKUP" "$ORG_ID" < deploy/coolify/smoke-objects.mjs
          docker compose exec -T worker npm run -s db:restore -- "$BACKUP" --check
          docker compose exec -T worker npm run -s retention:sweep
      # SeaweedFS stands in for the off-site destination (any S3-compatible bucket).
      - name: Off-site copy of a backup to an S3-compatible bucket
        run: |
          docker compose exec -T -e CEREBRO_BACKUP_S3_ENDPOINT=http://objects:8333 -e CEREBRO_BACKUP_S3_BUCKET=cerebro-offsite -e CEREBRO_BACKUP_S3_FORCE_PATH_STYLE=true worker sh -c '
            export CEREBRO_BACKUP_S3_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" CEREBRO_BACKUP_S3_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            CEREBRO_S3_BUCKET=cerebro-offsite npm run -s objects:init && npm run -s db:backup' | tee offsite.log
          grep -q "^Off-site copy: .* to bucket cerebro-offsite under cerebro-backups/" offsite.log
          grep -q "^Kept the newest 14 backups; deleted 0" offsite.log
      - name: db:restore into a fresh database and bucket
        run: |
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U postgres -c "create database cerebro_restore owner cerebro"
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U postgres -d cerebro_restore -c "create extension vector"
          docker compose exec -T -e CEREBRO_ALLOW_PRODUCTION_RESTORE=1 -e CEREBRO_S3_BUCKET=cerebro-restore worker sh -c '
            export DATABASE_URL="${DATABASE_URL%/cerebro}/cerebro_restore"
            npm run -s objects:init && npm run -s db:restore -- "$1" --yes' sh "$BACKUP" | tee restore.log
          grep -q "^Wrote back 1 objects" restore.log
          test "$(docker compose exec -T postgres psql -U postgres -d cerebro_restore -tAc "select count(*) from organizations where slug = 'smoke'")" = 1
          docker compose exec -T -e CEREBRO_S3_BUCKET=cerebro-restore worker node --import tsx --input-type=module - get "$ORG_ID" < deploy/coolify/smoke-objects.mjs
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
